name: alevi-gateway

# ANA SUNUCU: disariya yalnizca 80/443 acar (gateway).
# api/admin/postgres/redis ic agdadir, port yayinlamaz.
services:
  gateway:
    build:
      context: ../..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "25577:25577"
    environment:
      PORT: "25577"
      SITE_DIR: /srv/site
      API_UPSTREAM: http://api:3000
      ADMIN_UPSTREAM: http://admin:3000
    volumes:
      - ../../site:/srv/site:ro
    depends_on:
      - api
      - admin
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alevi}
      POSTGRES_USER: ${POSTGRES_USER:-alevi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0", "--protected-mode", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-alevi}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-alevi}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      MESH_ENABLED: ${MESH_ENABLED:-false}
      MESH_NODE_ID: ${MESH_NODE_ID:-gateway-1}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://canmeydani.com.tr,https://www.canmeydani.com.tr,https://api.canmeydani.com.tr,https://yonetim.canmeydani.com.tr}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-alevi-connect}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-alevi-mobile}
      SENSITIVE_DATA_KEY: ${SENSITIVE_DATA_KEY:?set SENSITIVE_DATA_KEY}
    command: ["sh", "-c", "npm run prisma:migrate && node dist/src/server.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-https://api.canmeydani.com.tr}
    environment:
      NODE_ENV: production
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
