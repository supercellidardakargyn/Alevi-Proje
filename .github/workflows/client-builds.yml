name: client-builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/client/**"
      - ".github/workflows/client-builds.yml"
permissions:
  contents: write

env:
  API_URL: https://api.sonalis.com.tr
  APP_NAME_DEFINE: Can Meydanı
  GOOGLE_WEB_CLIENT: 1070934024659-clseqcimci54ubir7e317ralrdo1ja9q.apps.googleusercontent.com

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: masaustu platformlarini ac
        shell: bash
        run: flutter config --enable-windows-desktop
      - name: derle
        working-directory: apps/client
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release \
            --dart-define=API_BASE_URL=${{ env.API_URL }} \
            --dart-define=MOCK_DATA=false \
            --dart-define=APP_NAME="${{ env.APP_NAME_DEFINE }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT }} 2>&1 | tee build.log
      - name: hata ozeti
        working-directory: apps/client
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            TAIL=$(tail -n 40 build.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::Windows x64 derleme hatasi -> $TAIL"
          else
            echo "::error::build.log yok; kurulum adimi patladi."
          fi
      - name: paketle
        shell: pwsh
        run: Compress-Archive -Path apps/client/build/windows/x64/runner/Release/* -DestinationPath can-meydani-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: can-meydani-windows-x64.zip

  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: masaustu arac zinciri
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: masaustu platformlarini ac
        run: flutter config --enable-linux-desktop
      - name: derle
        working-directory: apps/client
        run: |
          set -o pipefail
          flutter build linux --release \
            --dart-define=API_BASE_URL=${{ env.API_URL }} \
            --dart-define=MOCK_DATA=false \
            --dart-define=APP_NAME="${{ env.APP_NAME_DEFINE }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT }} 2>&1 | tee build.log
      - name: hata ozeti
        working-directory: apps/client
        if: failure()
        run: |
          if [ -f build.log ]; then
            TAIL=$(tail -n 40 build.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::Linux x64 derleme hatasi -> $TAIL"
          else
            echo "::error::build.log yok; kurulum adimi patladi."
          fi
      - name: paketle
        run: tar -czf can-meydani-linux-x64.tar.gz -C apps/client/build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: can-meydani-linux-x64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: masaustu platformlarini ac
        run: flutter config --enable-macos-desktop
      - name: derle
        working-directory: apps/client
        run: |
          set -o pipefail
          flutter build macos --release \
            --dart-define=API_BASE_URL=${{ env.API_URL }} \
            --dart-define=MOCK_DATA=false \
            --dart-define=APP_NAME="${{ env.APP_NAME_DEFINE }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT }} 2>&1 | tee build.log
      - name: hata ozeti
        working-directory: apps/client
        if: failure()
        run: |
          if [ -f build.log ]; then
            TAIL=$(tail -n 40 build.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::macOS derleme hatasi -> $TAIL"
          else
            echo "::error::build.log yok; kurulum adimi patladi."
          fi
      - name: paketle
        run: |
          cd apps/client/build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "Can Meydanı.app" can-meydani-macos.zip
          mv can-meydani-macos.zip "$GITHUB_WORKSPACE/can-meydani-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: can-meydani-macos.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: derle
        working-directory: apps/client
        run: |
          set -o pipefail
          flutter build web --release --base-href=/web/ \
            --dart-define=API_BASE_URL=${{ env.API_URL }} \
            --dart-define=MOCK_DATA=false \
            --dart-define=APP_NAME="${{ env.APP_NAME_DEFINE }}" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ env.GOOGLE_WEB_CLIENT }} 2>&1 | tee build.log
      - name: hata ozeti
        working-directory: apps/client
        if: failure()
        run: |
          TAIL=$(tail -n 40 build.log | tr -d '\r' | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::Web derleme hatasi -> $TAIL"
      - name: paketle
        run: cd apps/client/build/web && zip -r ../../../../can-meydani-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: can-meydani-web.zip

  yayinla:
    needs: [windows-x64, linux-x64, macos, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: topla ve sumer
        run: |
          mkdir -p publish
          find out -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} publish/ \;
          cd publish
          sha256sum * > SHA256SUMS-CLIENT.txt
          ls -la
      - name: clients release guncelle
        uses: ncipollo/release-action@v1
        with:
          tag: clients
          name: Can Meydani istemci surumleri
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: publish/*
