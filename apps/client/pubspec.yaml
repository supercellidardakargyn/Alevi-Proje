name: alevi_client
description: Alevi topluluk ve eşleşme mobil/Windows istemcisi.
publish_to: "none"
version: 0.5.1+6

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_sign_in: ^6.3.0
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.4.1
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/can-icon.png
  adaptive_icon_background: "#4D1228"
  adaptive_icon_foreground: assets/icon/can-icon-fg.png
  windows:
    generate: true
    image_path: assets/icon/can-icon.png
    icon_size: 256
  web:
    generate: true
    image_path: assets/icon/can-icon.png
    background_color: "#4D1228"
    theme_color: "#4D1228"
